---
name: ci

"on":
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-unit:
    uses: sous-chefs/.github/.github/workflows/lint-unit.yml@9.0.0
    permissions:
      actions: write
      checks: write
      pull-requests: write
      statuses: write
      issues: write

  integration:
    needs: lint-unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            "almalinux-8",
            "almalinux-9",
            "amazonlinux-2023",
            "centos-stream-9",
            "centos-stream-10",
            "debian-12",
            "rockylinux-8",
            "rockylinux-9",
            "ubuntu-2204",
            "ubuntu-2404",
          ]
        suite: ["distro", "repo"]
        exclude:
          - os: "centos-stream-10"
            suite: "repo"
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Cinc Workstation
        uses: sous-chefs/.github/.github/actions/install-workstation@9.0.0
      - name: Dokken
        uses: actionshub/test-kitchen@3.0.0
        env:
          CHEF_LICENSE: accept-no-persist
          CHEF_VERSION: latest
          KITCHEN_LOCAL_YAML: kitchen.dokken.yml
          KITCHEN_PRODUCT_NAME: cinc
        with:
          suite: ${{ matrix.suite }}
          os: ${{ matrix.os }}

  integration-epel:
    needs: lint-unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            "almalinux-8",
            "almalinux-9",
            "centos-stream-9",
            "centos-stream-10",
            "rockylinux-8",
            "rockylinux-9",
          ]
        suite: ["epel"]
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Cinc Workstation
        uses: sous-chefs/.github/.github/actions/install-workstation@9.0.0
      - name: Dokken
        uses: actionshub/test-kitchen@3.0.0
        env:
          CHEF_LICENSE: accept-no-persist
          CHEF_VERSION: latest
          KITCHEN_LOCAL_YAML: kitchen.dokken.yml
          KITCHEN_PRODUCT_NAME: cinc
        with:
          suite: ${{ matrix.suite }}
          os: ${{ matrix.os }}

  integration-nginx-full:
    needs: lint-unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-2204", "ubuntu-2404"]
        suite: ["distro-nginx-full"]
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Install Cinc Workstation
        uses: sous-chefs/.github/.github/actions/install-workstation@9.0.0
      - name: Dokken
        uses: actionshub/test-kitchen@3.0.0
        env:
          CHEF_LICENSE: accept-no-persist
          CHEF_VERSION: latest
          KITCHEN_LOCAL_YAML: kitchen.dokken.yml
          KITCHEN_PRODUCT_NAME: cinc
        with:
          suite: ${{ matrix.suite }}
          os: ${{ matrix.os }}

  final:
    runs-on: ubuntu-latest
    needs: [integration, integration-nginx-full, integration-epel]
    steps:
      - run: echo "integration completed"
      - run: echo "integration-nginx-full completed"
      - run: echo "integration-epel completed"
