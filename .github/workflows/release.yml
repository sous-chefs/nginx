---
name: release

"on":
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  attestations: write
  id-token: write

jobs:
  release:
    uses: sous-chefs/.github/.github/workflows/release-cookbook.yml@0fc55e405ea7c20c9650b92273833f9ba9cbdcdd # OCI pilot
    with:
      publish_oci: true
    secrets:
      token: ${{ secrets.PORTER_GITHUB_TOKEN }}
      supermarket_user: ${{ secrets.CHEF_SUPERMARKET_USER }}
      supermarket_key: ${{ secrets.CHEF_SUPERMARKET_KEY }}
      slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
      slack_channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
